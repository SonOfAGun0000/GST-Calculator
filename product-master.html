<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>GST Product Master</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="page-product">
<div class="app">
  <header>
    <div>
      <h1>VSTD COMPANY</h1>
      <p>11/33 Thadagam Rd, Edayarpalayam, Coimbatore - 641025</p>
    </div>
    <div class="hamburger" onclick="toggleMenu()">&#9776;</div>
  </header>
  <p class="docType docType-product">PRODUCT MASTER</p>

  <div class="masterCard">
    <div class="masterGrid">
      <div>
        <label>Product Code</label>
        <input id="pmCode" class="yellow" placeholder="Optional code">
      </div>
      <div>
        <label>Product Name</label>
        <input id="pmName" class="yellow" placeholder="Enter product">
      </div>
      <div>
        <label>Unit</label>
        <input id="pmUnit" class="yellow" placeholder="Kg / Nos / Ltr">
      </div>
      <div>
        <label>Default Rate (Without GST)</label>
        <input id="pmRate" class="yellow" type="number" inputmode="decimal" step="any" placeholder="0.00">
      </div>
      <div>
        <label>HSN</label>
        <input id="pmHsn" class="yellow" placeholder="Optional">
      </div>
      <div>
        <label>GST %</label>
        <input id="pmGst" class="yellow" type="number" inputmode="decimal" step="any" placeholder="Optional">
      </div>
    </div>
    <div class="buttons masterActions">
      <button onclick="saveCatalogRecord()">Save</button>
      <button onclick="clearCatalogForm()">Clear</button>
      <button onclick="exportData()">Backup</button>
      <button onclick="importData()">Import</button>
    </div>
    <div id="pmCount" class="masterCount"></div>
    <div class="tableScroll">
      <table id="pmTable" class="masterTable">
        <thead>
          <tr>
            <th>S.No</th>
            <th>Code</th>
            <th>Product</th>
            <th>Unit</th>
            <th>Rate</th>
            <th>HSN</th>
            <th>GST %</th>
            <th>Edit</th>
            <th>Del</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div id="menuOverlay" class="menuOverlay" onclick="closeMenu()"></div>
  <div id="sideMenu" class="sideMenu">
    <div class="menuHeader">
      <span>Menu</span>
      <button onclick="closeMenu()">&times;</button>
    </div>
    <button onclick="location.href='index.html'">Quotation Entry</button>
    <button onclick="location.href='purchase-order.html'">Purchase Order</button>
    <button onclick="location.href='product-master.html'">Product Master</button>
    <button onclick="location.href='folio-master.html'">Folio Master</button>
    <hr class="menuSeparator">
    <button onclick="shareApp()">Share App</button>
    <button onclick="checkUpdates()">Check for Updates</button>
  </div>
</div>
<div class="printContact">
  If you have any questions or doubts about this product master please contact - Kasi Anandan | +91 98946 99090
</div>
<script src="product-master.js" defer></script>
<script type="module" src="sync.js"></script>
</body>
</html>
