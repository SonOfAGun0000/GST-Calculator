<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">


<title>GST Quotation</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  padding:10px;
  background-color: #f8fafc;
}

.app{
  max-width:620px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}
header{
  text-align:left;
  margin-bottom:10px;
  border-bottom: #555 1px solid;
}

header h1{
  margin:0;
  font-size:30px;
  color: #991b2b;
  font-weight :700;
}

header p{
  margin:2px 0 12px;
  font-size:12px;
  color:#555;
}

label{
  font-size:13px;
  font-weight:600;
}

input{
  width:100%;
  box-sizing: border-box;
  padding:8px;
  margin:4px 0 10px;
  border:1px solid #ddd;
  border-radius:6px;
  font-size: 14px;
  transition: border-color 0.2s;
}
input:focus {
  outline: none;
  border-color: #991b2b;
  background-color: #fff;
}

.yellow{
  background:#fff4f5;
}

.row2{
  display:flex;
  align-items: flex-end;
  justify-content: space-between;
}
.quoteno{
  width:190px;
}

.quoteno input{
  font-weight:800;
  width: 80px;
}

.date{
  min-width: 190px;
}
.date input{
  max-width:150px;
}

.client{
  width:100%;
}
.client input{
  font-weight:400;
  font-size:12px;
}

.phone{
  width:100%;
}
.phone input{
  font-weight:400;
  font-size:12px;
}


table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
}

#tbl th:nth-child(1), #tbl td:nth-child(1) { width: 20px; }  /* S.No */
#tbl th:nth-child(2), #tbl td:nth-child(2) { width: auto; }  /* Product (Flexible) */
#tbl th:nth-child(3), #tbl td:nth-child(3) { width: 50px; }  /* Qty */
#tbl th:nth-child(4), #tbl td:nth-child(4) { width: 70px; }  /* Rate */
#tbl th:nth-child(5), #tbl td:nth-child(5) { width: 80px; }  /* Amount */
#tbl th:nth-child(6), #tbl td:nth-child(6) { width: 30px; }  /* X Button */

.addProduct{
  width:100%;
  background:#991b2b;
  color:white;
  padding:10px;
  border:none;
  border-radius:6px;
  margin:10px 0;
}

.totals{
  text-align:right;
  font-size:14px;
  margin: 10px 0;
}

.small{
  width:110px;
}

.buttons{
  display:flex;
  gap:6px;
  margin-top:12px;
}

.buttons button{
  flex:1;
  padding:10px;
  background:#991b2b;
  color:white;
  border:none;
  border-radius:6px;
}
.del-btn {
  background: none;
  border: none;
  color: #ef4444;
  font-size: 16px;
  cursor: pointer;
  padding: 0;
}
#tbl input {
  margin: 0;
  padding: 6px;
  font-size: 13px;
  border-radius: 4px;
}

.gstPresets{
  margin-top:6px;
  display:flex;
  gap:6px;
}
.gstPresets button{
  flex:1;
  padding:6px;
  font-size:13px;
  background:#e6e6e6;
  border:none;
  border-radius:6px;
}

/* Icons CSS */

<body>
<div class="app">
<header>
  <h1>VSTD COMPANY</h1>
  <p>11/33 Thadagam Rd, Edayarpalayam, Coimbatore - 641025</p>
</header>

<div class="row2">
  <div class="quoteno">
    <label>Quotation No</label>
    <input id="qno" class="yellow">
  </div>

  <div class="date">
     <label>Date</label>
     <input type="date" id="date" class="yellow">
  </div>
</div>

<div class="client">
  <label>Client Name:</label>
  <input id="client" class="yellow">
</div>

<div class="phone">
  <label>Phone:</label>
  <label>+91</label>
  <input id="phone" class="yellow" type="tel">
</div>

<table id="tbl">
<thead>
<tr>
<th>S.No</th><th>Product</th><th>Qty</th><th>Rate</th><th>Amount</th>
<th></th>
</tr>
</thead>
<tbody></tbody>
</table>

<button class="addProduct" onclick="addRow()">+ Add Product</button>

<div class="totals">

  <div>Taxable Value <span id="subtotal">0.00</span></div>

  <div>
    Pkg/Fwd
    <input id="pkg" type="number" inputmode="decimal" step="any" class="yellow small" value="">
  </div>

  <div>
    Discount
    <input id="disc" type="number" inputmode="decimal" step="any" class="yellow small" value="">
  </div>

  <div>
    GST %
    <input id="gst" type="number" inputmode="decimal" step="any" class="yellow small" value="">
    <div class="gstPresets">
      <button type="button" onclick="setGST(5)">5%</button>
      <button type="button" onclick="setGST(12)">12%</button>
      <button type="button" onclick="setGST(18)">18%</button>
      <button type="button" onclick="setGST(28)">28%</button>
    </div>
  </div>

  <div>CGST <span id="cgst">0.00</span></div>
  <div>SGST <span id="sgst">0.00</span></div>

  <h2>Grand Total ₹ <span id="grand" style="color: #db273f;">0.00</span></h2>

</div>

<div class="buttons">
  <button onclick="saveQuotation()"><span class="glyphs-poly--save"></span></button>
  <button onclick="clearForm()"><span class="twemoji--broom"></span></button>
  <button onclick="window.print()"><span class="vscode-icons--file-type-pdf2"></span></button>
  <button onclick="shareWhatsApp()"><span class="logos--whatsapp-icon"></span></button>
  <button onclick="openLedger()"><span class="fluent-color--history-20"></span></button>
</div>

</div>


<script>

const products=["Sugar","Groundnut Oil","Rice","Oil","Toor Dhall","Channa Flour"];
const STORE_KEY = "gst_quotes_history";

// Generate next quotation number
function nextQuotationNumber(){
  let data = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
  return data.length ? (data[data.length-1].qno + 1) : 1;
}

// Save quotation to local storage
function saveQuotation(){
  let rows=[];
  document.querySelectorAll("#tbl tbody tr").forEach(r=>{
    let name=r.cells[1].querySelector("input").value;
    let qty=r.cells[2].querySelector("input").value;
    let rate=r.cells[3].querySelector("input").value;

    if(name && qty>0 && rate>0){
      rows.push({name,qty,rate});
    }
  });

  let record={
    qno:+qno.value,
    date:date.value,
    client:client.value,
    phone:phone.value,
    pkg:+pkg.value||0,
    disc:+disc.value||0,
    gst:+gst.value||0,
    items:rows
  };

  let data = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
  data.push(record);

  localStorage.setItem(STORE_KEY, JSON.stringify(data));

  alert("✅ Successfully saved");
}

qno.addEventListener("change", loadQuotation);

// Load quotation from local storage
function loadQuotation(){

  let data = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");

  let rec = data.find(x => x.qno == qno.value);
  if(!rec) return;

  client.value = rec.client;
  phone.value  = rec.phone;
  date.value   = rec.date;
  pkg.value    = rec.pkg;
  disc.value   = rec.disc;
  gst.value    = rec.gst;

  document.querySelector("#tbl tbody").innerHTML="";

  rec.items.forEach(it=>{
    addRow();
    let r=document.querySelector("#tbl tbody tr:last-child");
    r.cells[1].querySelector("input").value=it.name;
    r.cells[2].querySelector("input").value=it.qty;
    r.cells[3].querySelector("input").value=it.rate;
  });

  calc();
}


// Add new row to the table
function addRow(){
  let tbody=document.querySelector("#tbl tbody");
  let row=tbody.insertRow();
  let sno=tbody.rows.length;

  row.innerHTML=`
  <td>${sno}</td>
  <td>
    <input list="plist" class="yellow">
  </td>
  <td><input type="number" inputmode="decimal" step="any" value="" onchange="calc()" class="yellow"></td>
  <td><input type="number" inputmode="decimal" step="any" value="" onchange="calc()" class="yellow"></td>
  <td>0</td>
  <td><button class="del-btn" onclick="this.closest('tr').remove();calc()">×</button></td>
  `;
}

let d=document.createElement("datalist");
d.id="plist";
products.forEach(p=>{
  let o=document.createElement("option");
  o.value=p;
  d.appendChild(o);
});
document.body.appendChild(d);

// GST Buttons
function setGST(val){
  gst.value = val;
  calc();
}

// Calculate totals
function calc(){
  let subtotal=0;

  document.querySelectorAll("#tbl tbody tr").forEach((r,i)=>{
    r.cells[0].innerText=i+1;

    let q=r.cells[2].children[0].value||0;
    let rate=r.cells[3].children[0].value||0;

    let amt=q*rate;
    r.cells[4].innerText=amt.toFixed(2);

    subtotal+=amt;
  });

  document.getElementById("subtotal").innerText=subtotal.toFixed(2);

  let pkg=+pkgInput();
  let disc=+discInput();
  let gst=+gstInput();

  let taxable=subtotal+pkg-disc;
  let tax=taxable*(gst/100);

  let half=tax/2;

  document.getElementById("cgst").innerText=half.toFixed(2);
  document.getElementById("sgst").innerText=half.toFixed(2);
  document.getElementById("grand").innerText=(taxable+tax).toFixed(2);
}

function pkgInput(){return document.getElementById("pkg").value||0}
function discInput(){return document.getElementById("disc").value||0}
function gstInput(){return document.getElementById("gst").value||0}

["pkg","disc","gst"].forEach(id=>{
  document.getElementById(id).oninput=calc;
});

// Clear form
function clearForm(){
  location.reload();
}

// Format number in Indian style
function indian(n){
  return Number(n).toLocaleString('en-IN',{minimumFractionDigits:2});
}

// Share quotation via WhatsApp
function shareWhatsApp(){
  function indian(n){
    return Number(n).toLocaleString('en-IN',{minimumFractionDigits:2});
  }

  function formatDate(d){
    if(!d) return "";
    let parts=d.split("-");
    return `${parts[2]}-${parts[1]}-${parts[0]}`;
  }

  let clientName = document.getElementById("client").value || "Customer";
  let dateVal = formatDate(document.getElementById("date").value);

  let msg = `Hi, M/s ${clientName},\n`;
  msg += `Quote: -\n`;
  msg += `Date: ${dateVal}\n\n`;

  let subtotal = 0;

  document.querySelectorAll("#tbl tbody tr").forEach(r=>{

    let name = r.cells[1].querySelector("input").value;
    let qty  = +r.cells[2].querySelector("input").value;
    let rate = +r.cells[3].querySelector("input").value;

    if(name && qty>0 && rate>0){

      let amt = qty*rate;
      subtotal += amt;

      msg += `${name}\n`;
      msg += `     ${indian(rate)} × ${qty} = ${indian(amt)}\n\n`;
    }
  });

  let pkg  = +document.getElementById("pkg").value || 0;
  let disc = +document.getElementById("disc").value || 0;
  let gst  = +document.getElementById("gst").value || 0;

  if(pkg>0)  msg += `(+) Packaging : ${indian(pkg)}\n`;
  if(disc>0) msg += `(-) Discount : ${indian(disc)}\n`;

  let taxable = subtotal + pkg - disc;
  let tax = taxable * gst/100;
  let half = tax/2;

  msg += `Taxable Value = ${indian(taxable)}\n`;
  msg += `(+) GST ${gst}% :\n`;
  msg += `          CGST ${gst/2}% = ${indian(half)}\n`;
  msg += `          SGST ${gst/2}% = ${indian(half)}\n\n`;
  msg += `Grand Total = *${indian(taxable+tax)}*`;

  let phone = document.getElementById("phone").value.replace(/\D/g,'');

if(phone){
  window.open("https://wa.me/91" + phone + "?text=" + encodeURIComponent(msg), "_blank");
}else{
  window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
}
}

document.getElementById("date").valueAsDate = new Date();
document.getElementById("qno").value = nextQuotationNumber();

addRow();
calc();

</script>

<div id="ledgerModal" style="
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:999;
">

<div style="
background:white;
margin:20px;
padding:15px;
border-radius:10px;
height:90%;
overflow:auto;
">

<h3>Quotation History</h3>

Date:
<input type="date" id="fDate">

Customer:
<input id="fClient">

Product:
<input id="fProduct">
<div class="buttons">
<button onclick="filterLedger()">Filter</button>
<button onclick="exportLedgerPDF()">PDF</button>
<button onclick="closeLedger()">Close</button>
</div>
<table id="ledgerTable" style="margin-top:10px;width:100%;border-collapse:collapse">
<thead>
<tr>
<th>No</th>
<th>Date</th>
<th>Client</th>
<th>Total</th>
<th>Open</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
// Ledger modal
  function openLedger(){
  document.getElementById("ledgerModal").style.display="block";
  renderLedger();
}
// Close ledger modal
function closeLedger(){
  document.getElementById("ledgerModal").style.display="none";
}
// Get history from local storage
function getHistory(){
  return JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
}
// Open quotation from ledger
function renderLedger(list=null){

  let data = list || getHistory();

  let tbody=document.querySelector("#ledgerTable tbody");
  tbody.innerHTML="";

  data.forEach(r=>{

    let subtotal=0;
    r.items.forEach(i=> subtotal += i.qty*i.rate);

    let taxable=subtotal + r.pkg - r.disc;
    let tax=taxable*r.gst/100;
    let grand=taxable+tax;

    let tr=document.createElement("tr");

    tr.innerHTML=`
      <td>${r.qno}</td>
      <td>${r.date}</td>
      <td>${r.client}</td>
      <td>${grand.toLocaleString('en-IN')}</td>
      <td><button class="del-btn" onclick="openFromLedger(${r.qno})">Open</button></td>
    `;

    tbody.appendChild(tr);
  });
}
// Filter ledger entries
function filterLedger(){

  let d=fDate.value;
  let c=fClient.value.toLowerCase();
  let p=fProduct.value.toLowerCase();

  let data=getHistory().filter(r=>{

    let ok=true;

    if(d && r.date!=d) ok=false;

    if(c && !r.client.toLowerCase().includes(c)) ok=false;

    if(p){
      let found=r.items.some(i=>i.name.toLowerCase().includes(p));
      if(!found) ok=false;
    }

    return ok;
  });

  renderLedger(data);
}
// Open quotation from ledger
function openFromLedger(no){
  closeLedger();
  qno.value=no;
  loadQuotation();
}
// Export ledger to PDF
function exportLedgerPDF(){
  window.print();
}
</script>
