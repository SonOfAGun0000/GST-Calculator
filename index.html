<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">


<title>GST Quotation</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>
<div class="app">
<header>
  <div>
    <h1>VSTD COMPANY</h1>
    <p>11/33 Thadagam Rd, Edayarpalayam, Coimbatore - 641025</p>
  </div>
  <div class="hamburger" onclick="toggleMenu()">
    ☰
  </div>
</header>

<div class="row2">
  <div class="quoteno">
    <label>Quotation No</label>
    <input id="qno" class="yellow">
  </div>

  <div class="date">
     <label>Date</label>
     <input type="date" id="date" class="yellow">
  </div>
</div>

<div class="clientDiv">
  <div class="client">
    <label>Party Name:</label>
    <input id="client" class="yellow">
  </div>
</div>

<div class="phoneDiv">
  <div class="phone">
    <label>Phone:</label>
    <label>+91</label>
    <input id="phone" class="yellow" type="tel">
  </div>
</div>

<table id="tbl">
<thead>
<tr>
<th>S.No</th><th>Product</th><th>Qty</th><th>Rate</th><th>Amount</th>
<th></th>
</tr>
</thead>
<tbody></tbody>
</table>

<button class="addProduct" onclick="addRow()">+ Add Product</button>

<div class="totals">

  <div>Taxable Value <span id="subtotal">0.00</span></div>

  <div class="pkgDiv">
    <div>
      Pkg/Fwd
      <input id="pkg" type="number" inputmode="decimal" step="any" class="yellow small" value="">
    </div>
  </div>
  <div class="discDiv">
    <div>
      Discount
      <input id="disc" type="number" inputmode="decimal" step="any" class="yellow small" value="">
    </div>
  </div>
  <div class="gst-row">
    <div class="gstPresets">
      <button type="button" onclick="setGST(5)">5%</button>
      <button type="button" onclick="setGST(18)">18%</button>
      <button type="button" onclick="setGST(28)">28%</button>
    </div>
    GST %
    <input id="gst" type="number" inputmode="decimal" step="any" class="yellow small" value="">
  </div>

  <div>CGST <span id="cgst">0.00</span></div>
  <div>SGST <span id="sgst">0.00</span></div>

  <h2>Grand Total ₹ <span id="grand" style="color: #db273f;">0.00</span></h2>

</div>

<div class="buttons">
  <button onclick="saveQuotation()"><span class="glyphs-poly--save"></span></button>
  <button onclick="clearForm()"><span class="twemoji--broom"></span></button>
  <button onclick="triggerPrint()"><span class="vscode-icons--file-type-pdf2"></span></button>
  <button onclick="shareWhatsApp()"><span class="logos--whatsapp-icon"></span></button>
  <button onclick="openLedger()"><span class="fluent-color--history-20"></span></button>
</div>
<div id="menuOverlay" class="menuOverlay" onclick="closeMenu()"></div>
  <div id="sideMenu" class="sideMenu">
    <div class="menuHeader">
      <span>Menu</span>
      <button onclick="closeMenu()">✕</button>
    </div>

    <button onclick="exportData()">Backup Data</button>
    <button onclick="importData()">Import Data</button>
    <button onclick="shareApp()">Share App</button>
    <button onclick="checkUpdates()">Check for Updates</button>
  </div>
</div>

<script src="app.js" defer></script>

<div id="ledgerModal" style="
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:999;
">

<div style="
background:white;
margin:20px;
padding:15px;
border-radius:10px;
height:90%;
overflow:auto;
">

<h3>Quotation History</h3>
<div id="ledgerCount" style="font-size:12px;color:#555;margin-bottom:8px;"></div>

Date:
<input type="date" id="fDate">

Customer:
<input id="fClient">

Product:
<input id="fProduct">
<div class="buttons">
<button onclick="filterLedger()">Filter</button>
<button onclick="exportLedgerPDF()">PDF</button>
<button onclick="closeLedger()">Close</button>
</div>
<table id="ledgerTable" style="margin-top:10px;width:100%;border-collapse:collapse">
<thead>
<tr>
<th>No</th>
<th>Date</th>
<th>Client</th>
<th>Total</th>
<th>📂</th>
<th>🗑️</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>
</div>

<script type="module" src="sync.js"></script>
</body>
</html>
